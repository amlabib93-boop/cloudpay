# One project name for every checkout (main repo and worktrees), so they all
# manage the same containers and volumes instead of clashing on container_name.
name: cloudpay

networks:
  cloudpay-network:
    driver: bridge

volumes:
  postgres_wallet_data:
  # Other named volumes declared when their service is uncommented

services:

  # ─── Active Infrastructure ───────────────────────────────────────

  postgres-wallet:
    image: postgres:16-alpine
    container_name: cloudpay-postgres-wallet
    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_wallet_data:/var/lib/postgresql/data
    networks:
      - cloudpay-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d wallet_db"]
      interval: 10s
      timeout: 5s
      retries: 5

